name: Tests

# main gets one squash-merged pull request per release, checked on that pull request; the merge itself starts no
# run, so a commit on main carries no second, half-skipped set of checks. Every night the whole suite runs on main
# (schedule), the net under the pull requests that ran only some tests; the README's Tests badge shows that run.
# The page drawing and the pull request title are checked in pull-request.yml.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

# A new push to a pull request stops its older run; a nightly or manual run always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests run once per release, on its pull request (the ruleset requires them there). A manual or nightly run
  # tests everything. On a pull request, scripts/ci-lane.mjs picks how much from the files it changes:
  #   docs   pages and pictures only: one quick Linux job per system says so and runs no test (no check is
  #          left skipped, so the pull request shows only passed checks)
  #   small  one job per system runs the tests that cover the changed files, plus the update path tests
  #   full   the whole suite, in two jobs per system side by side, split by tests/run-all-timings.json
  #          (run-all.mjs --shard): together they run every test file once. Part 1 holds the files that need
  #          ffmpeg and installs it; its install time counts in the split.
  # ffmpeg and Chromium are installed only when a picked test needs them. The ruleset requires
  # "test (windows-latest)" and "test (macos-latest)": the small jobs of those names below are green only when
  # every part of their system passed.
  # The limit stops a hung job, not one waiting in the queue. When GitHub has no macOS runner free, the job ends
  # red with "The job was not acquired by Runner"; that is not a test failure: re-run the failed job.
  # The checkout fetches the tags too, each with its own commit only: tests/test-phone-steady.mjs takes the released
  # v26.3.3 phone program, page and relay from git tag v26.3.3 to run them with the new ones, and leaves those checks
  # out without it.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      parts: ${{ steps.lane.outputs.parts }}
      only: ${{ steps.lane.outputs.only }}
      ffmpeg: ${{ steps.lane.outputs.ffmpeg }}
      browser: ${{ steps.lane.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: lane
        shell: bash
        run: node scripts/ci-lane.mjs "$BASE" --event "$EVENT" --github-output "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}

  test-windows-parts:
    needs: plan
    name: test (windows-latest, ${{ needs.plan.outputs.lane == 'full' && format('part {0}/2', matrix.part) || needs.plan.outputs.lane == 'docs' && 'pages only, no tests' || 'changed files' }})
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    runs-on: ${{ needs.plan.outputs.lane == 'docs' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 30
    steps:
      - if: needs.plan.outputs.lane == 'docs'
        run: echo "Pages and pictures only, no test to run; the page drawing runs in pull-request.yml."
      - if: needs.plan.outputs.lane != 'docs'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
      - if: needs.plan.outputs.lane != 'docs'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # tests/test-watch.mjs and tests/test-picture-gate.mjs draw with ffmpeg, which the runners do not have.
      # It comes from one dated BtbN build on GitHub (with drawtext), checked against its SHA-256, not Chocolatey,
      # whose feed was down twice in a row. A newer build: its tag, file name and the digest GitHub lists for it.
      - if: matrix.part == 1 && needs.plan.outputs.ffmpeg == 'true'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-23-12-43/ffmpeg-N-129241-g05c674c913-win64-gpl.zip" -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 10
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne "694E2E119ADFF51B6C7B7DB260173760EA308F343CBFF88C04883DBA7A8B1A1C") { throw "ffmpeg download does not match its pinned SHA-256" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1).FullName + "\bin"
          & "$bin\ffmpeg.exe" -hide_banner -filters | Select-String drawtext
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg from the download does not run" }
          Add-Content $env:GITHUB_PATH $bin
      # Files side by side; on a failure the failed files run again one at a time with their full output, so the
      # whole log is in the run. The step stays red even when the rerun passes: a flaky test is still a failure.
      # tests/test-render-check.mjs draws pages with the packages of package.json and Playwright's Chromium. The
      # browser goes to a folder of the runner: run-all.mjs gives each test an empty home folder, where a Mac keeps
      # Playwright's browsers.
      - if: needs.plan.outputs.lane != 'docs'
        shell: bash
        run: npm ci --no-audit --no-fund && { [ "$BROWSER" != true ] || npx playwright install chromium; }
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          BROWSER: ${{ needs.plan.outputs.browser }}
      - if: needs.plan.outputs.lane != 'docs'
        shell: bash
        run: |
          if [ "$LANE" = full ]; then pick=(--shard "$PART/2"); else pick=(--only "$ONLY"); fi
          node tests/run-all.mjs "${pick[@]}" || { node tests/run-all.mjs --failed --verbose; exit 1; }
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          LANE: ${{ needs.plan.outputs.lane }}
          PART: ${{ matrix.part }}
          ONLY: ${{ needs.plan.outputs.only }}

  test-windows:
    if: always()
    name: test (windows-latest)
    needs: [plan, test-windows-parts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          test "$PLAN" = success || { echo "the lane step ended $PLAN"; exit 1; }
          test "$PARTS" = success || { echo "a Windows test part ended $PARTS"; exit 1; }
        env:
          PLAN: ${{ needs.plan.result }}
          LANE: ${{ needs.plan.outputs.lane }}
          PARTS: ${{ needs.test-windows-parts.result }}

  test-macos-parts:
    needs: plan
    name: test (macos-latest, ${{ needs.plan.outputs.lane == 'full' && format('part {0}/2', matrix.part) || needs.plan.outputs.lane == 'docs' && 'pages only, no tests' || 'changed files' }})
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    runs-on: ${{ needs.plan.outputs.lane == 'docs' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 30
    steps:
      - if: needs.plan.outputs.lane == 'docs'
        run: echo "Pages and pictures only, no test to run; the page drawing runs in pull-request.yml."
      - if: needs.plan.outputs.lane != 'docs'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
      - if: needs.plan.outputs.lane != 'docs'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # On a Mac the plain ffmpeg has no drawtext filter; skills/watch/watch.mjs finds ffmpeg-full by itself.
      - if: matrix.part == 1 && needs.plan.outputs.ffmpeg == 'true'
        run: brew install ffmpeg ffmpeg-full
      # tests/test-render-check.mjs draws pages with the packages of package.json and Playwright's Chromium. The
      # browser goes to a folder of the runner: run-all.mjs gives each test an empty home folder, where a Mac keeps
      # Playwright's browsers.
      - if: needs.plan.outputs.lane != 'docs'
        shell: bash
        run: npm ci --no-audit --no-fund && { [ "$BROWSER" != true ] || npx playwright install chromium; }
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          BROWSER: ${{ needs.plan.outputs.browser }}
      - if: needs.plan.outputs.lane != 'docs'
        shell: bash
        run: |
          if [ "$LANE" = full ]; then pick=(--shard "$PART/2"); else pick=(--only "$ONLY"); fi
          node tests/run-all.mjs "${pick[@]}" || { node tests/run-all.mjs --failed --verbose; exit 1; }
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          LANE: ${{ needs.plan.outputs.lane }}
          PART: ${{ matrix.part }}
          ONLY: ${{ needs.plan.outputs.only }}

  test-macos:
    if: always()
    name: test (macos-latest)
    needs: [plan, test-macos-parts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          test "$PLAN" = success || { echo "the lane step ended $PLAN"; exit 1; }
          test "$PARTS" = success || { echo "a macOS test part ended $PARTS"; exit 1; }
        env:
          PLAN: ${{ needs.plan.result }}
          LANE: ${{ needs.plan.outputs.lane }}
          PARTS: ${{ needs.test-macos-parts.result }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        # The Biome of biome.json's $schema; a newer one can bring new rules that fail CI
        with:
          version: 2.6.7
      - run: biome ci .

  # One job, not a matrix, so the check is named "typecheck" (the release ruleset requires that name).
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            extensions/commands/package-lock.json
            extensions/read-aloud/package-lock.json
            extensions/systems-map/package-lock.json
            extensions/usage-plan/package-lock.json
      # Each folder in its own step, so a failure stops the job and the step name says which folder.
      # The commands tests include copy-row, which bundles with the installed esbuild.
      - name: commands
        working-directory: extensions/commands
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm test
      - name: read-aloud
        if: ${{ !cancelled() }}
        working-directory: extensions/read-aloud
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
      - name: systems-map
        if: ${{ !cancelled() }}
        working-directory: extensions/systems-map
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
      - name: usage-plan
        if: ${{ !cancelled() }}
        working-directory: extensions/usage-plan
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit

  # The private word list never leaves the PC (git ignores it), so CI checks the patterns only:
  # home folder paths, email addresses, keys and tokens, credit lines, backup files, big files.
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/privacy-check.mjs .

  # gitleaks over every commit, not only the new ones: a key added in one commit and deleted in a later one is still
  # in the history GitHub serves. The repo's .gitleaks.toml allows the public and fake values, each with its reason.
  # The release download, not gitleaks-action: on a pull request the action scans only that pull request's commits.
  # Pinned by version and by the sha256 of the download (from the release's gitleaks_8.30.1_checksums.txt).
  secret-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # --redact: a finding shows the file, line, rule and commit, never the value.
      - run: $RUNNER_TEMP/gitleaks git --config .gitleaks.toml --redact --no-banner .

  # npm audit reads each package-lock.json and needs no install. Each folder in its own step. The release waits on
  # every check of this run, so a step that fails (a new advisory on a package the release did not touch, or npm
  # not answering) only warns: continue-on-error keeps the job green, and a ::warning:: line names the folder.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: commands
        continue-on-error: true
        working-directory: extensions/commands
        run: |
          npm audit --audit-level=high || { echo "::warning::npm audit failed in extensions/commands (a high advisory, or npm did not answer)"; exit 1; }
      - name: read-aloud
        continue-on-error: true
        working-directory: extensions/read-aloud
        run: |
          npm audit --audit-level=high || { echo "::warning::npm audit failed in extensions/read-aloud (a high advisory, or npm did not answer)"; exit 1; }
      - name: systems-map
        continue-on-error: true
        working-directory: extensions/systems-map
        run: |
          npm audit --audit-level=high || { echo "::warning::npm audit failed in extensions/systems-map (a high advisory, or npm did not answer)"; exit 1; }
      - name: usage-plan
        continue-on-error: true
        working-directory: extensions/usage-plan
        run: |
          npm audit --audit-level=high || { echo "::warning::npm audit failed in extensions/usage-plan (a high advisory, or npm did not answer)"; exit 1; }
