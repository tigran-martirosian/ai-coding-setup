name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # tests/test-watch.mjs draws a short video with ffmpeg, which the runners do not have.
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      # On a Mac the plain ffmpeg has no drawtext filter; skills/watch/watch.mjs finds ffmpeg-full by itself.
      - if: runner.os == 'macOS'
        run: brew install ffmpeg ffmpeg-full
      # tests/test-versions.mjs asks the GitHub API; without a token the shared runner addresses hit its rate limit
      # --verbose: one file at a time with its full output, so a failure's whole log is in the run
      - run: node tests/run-all.mjs --verbose
        env:
          GITHUB_TOKEN: ${{ github.token }}
