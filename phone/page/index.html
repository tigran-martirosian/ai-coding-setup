<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Nimbalyst</title>
    <!-- Only shell.css holds the first paint. The other style files load beside it as preloads, and frame/boot.js
         turns each into a style sheet where it stands, so the cascade order stays tokens, page, shell, files, wide. -->
    <link rel="preload" as="style" href="shared/tokens.css" data-late />
    <link rel="preload" as="style" href="page/page.css" data-late />
    <link rel="stylesheet" href="page/shell.css" />
    <link rel="preload" as="style" href="page/files.css" data-late />
    <link rel="preload" as="style" href="page/wide.css" data-late />
    <script async id="tg-script" src="page/telegram-web-app.js"></script>
    <!-- modulepreload -->
    <script type="module" src="page/frame/boot.js"></script>
    <script type="module" src="page/frame/app.js"></script>
  </head>
  <body>
    <div id="fatal" class="fatal" role="alert" hidden></div>
    <!-- The skeleton (comfort design, section 2): each tab's shapes, in the first paint. The frame moves a tab's
         shapes into #content while nothing is kept for that tab, and hides this shell once it draws. -->
    <div id="shell" class="shell">
      <main class="sk-content" aria-busy="true">
        <p class="sk-label">Loading</p>
        <section class="sk-tab" data-tab="home">
          <div class="title-row"><h1 class="large-title">Home</h1></div>
          <div id="sk-home" class="sk-body" aria-hidden="true">
            <div class="sk-block sk-pc"><i class="sk-circle"></i><div class="sk-lines"><i class="sk-bar sk-w55"></i><i class="sk-bar sk-w35"></i></div></div>
            <h2 class="sk-head">Needs you</h2>
            <div class="sk-block sk-rows">
              <div class="sk-row"><i class="sk-orb"></i><div class="sk-lines"><i class="sk-bar sk-w62"></i><i class="sk-bar sk-w38"></i></div></div>
            </div>
            <h2 class="sk-head">Working</h2>
            <div class="sk-block sk-rows">
              <div class="sk-row"><i class="sk-orb"></i><div class="sk-lines"><i class="sk-bar sk-w48"></i><i class="sk-bar sk-w30"></i></div></div>
              <div class="sk-row"><i class="sk-orb"></i><div class="sk-lines"><i class="sk-bar sk-w70"></i><i class="sk-bar sk-w44"></i></div></div>
              <div class="sk-row"><i class="sk-orb"></i><div class="sk-lines"><i class="sk-bar sk-w55"></i><i class="sk-bar sk-w38"></i></div></div>
            </div>
          </div>
        </section>
        <section class="sk-tab" data-tab="projects" hidden>
          <div class="title-row"><h1 class="large-title">Projects</h1></div>
          <div id="sk-projects" class="sk-body" aria-hidden="true">
            <div class="sk-search">Search projects</div>
            <div class="sk-block sk-rows">
              <div class="sk-row"><i class="sk-tile"></i><div class="sk-lines"><i class="sk-bar sk-w62"></i><i class="sk-bar sk-w38"></i></div></div>
              <div class="sk-row"><i class="sk-tile"></i><div class="sk-lines"><i class="sk-bar sk-w48"></i><i class="sk-bar sk-w30"></i></div></div>
              <div class="sk-row"><i class="sk-tile"></i><div class="sk-lines"><i class="sk-bar sk-w70"></i><i class="sk-bar sk-w44"></i></div></div>
              <div class="sk-row"><i class="sk-tile"></i><div class="sk-lines"><i class="sk-bar sk-w55"></i><i class="sk-bar sk-w38"></i></div></div>
              <div class="sk-row"><i class="sk-tile"></i><div class="sk-lines"><i class="sk-bar sk-w62"></i><i class="sk-bar sk-w30"></i></div></div>
              <div class="sk-row"><i class="sk-tile"></i><div class="sk-lines"><i class="sk-bar sk-w48"></i><i class="sk-bar sk-w44"></i></div></div>
              <div class="sk-row"><i class="sk-tile"></i><div class="sk-lines"><i class="sk-bar sk-w70"></i><i class="sk-bar sk-w38"></i></div></div>
            </div>
          </div>
        </section>
        <section class="sk-tab" data-tab="settings" hidden>
          <div class="title-row"><h1 class="large-title">Settings</h1></div>
          <div id="sk-settings" class="sk-body" aria-hidden="true">
            <div class="sk-block sk-rows">
              <div class="sk-row sk-plain"><div class="sk-lines"><i class="sk-bar sk-w62"></i><i class="sk-bar sk-w38"></i></div></div>
            </div>
            <div class="sk-block sk-rows">
              <div class="sk-row sk-plain"><div class="sk-lines"><i class="sk-bar sk-w48"></i><i class="sk-bar sk-w30"></i></div></div>
            </div>
          </div>
        </section>
      </main>
      <nav class="sk-tabbar" aria-label="Tabs">
        <button class="sk-tabbtn" type="button" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z" /></svg>Home</button>
        <button class="sk-tabbtn" type="button" data-tab="projects"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3.5 6.5h6l2 2h9v10h-17z" /></svg>Projects</button>
        <button class="sk-tabbtn" type="button" data-tab="files"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 3.5h6l4 4v9a1.5 1.5 0 0 1-1.5 1.5H9A1.5 1.5 0 0 1 7.5 16.5V5A1.5 1.5 0 0 1 9 3.5z" /><path d="M15 3.5v4h4" /><path d="M4.5 7.5v11A2 2 0 0 0 6.5 20.5H15" /></svg>Files</button>
        <button class="sk-tabbtn" type="button" data-tab="settings"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M6 18l1.6-1.6M16.4 7.6 18 6" /><path d="M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z" /><path d="M12 5.8a6.2 6.2 0 1 0 0 12.4a6.2 6.2 0 1 0 0-12.4z" /></svg>Settings</button>
      </nav>
    </div>
    <div id="app" class="app" hidden>
      <main id="content" class="content"></main>
      <div id="bottom" class="bottom" hidden>
        <div id="bottom-extra"></div>
        <button id="main-btn" class="btn-main" type="button" hidden></button>
      </div>
      <nav id="tabbar" class="tabbar" aria-label="Tabs" hidden></nav>
    </div>
  </body>
</html>
