<!-- Picture fixture for the Job Tracker: a stand-in for Nimbalyst 0.83.0's tracker page (gutter, tracker sidebar,
     the main pane with its toolbar and .tracker-table-container, the item view on the right) and a made-up release
     with 27 steps: 17 done, 4 running, 3 to do and 3 for the user (each waiting on an open step), plus one dropped
     step, one archived step and a step of an older release ("3.0", released on Fri 6 Nov as v3.0), which must not
     count, and five open steps outside any release (the sidebar's "Not in a release"). The steps are in three stages:
     "Part 1 · fixes" all 12 done, "Part 2 · design" 5 of 10 done with the 4 running (and the dropped step), "Part 3 ·
     builds" 0 of 5 done. S22 has a `file` (its "Open <file>" link). The app's list shows the open steps only, as
     its Open filter does; the page hides it and draws its own folds. The items are in the JSON
     block below in the shape window.documentService.listTrackerItems gives; test.mjs reads the same block.
     window.fxAddStep(item) stands in for the app adding a step later: the item joins the data, the watch listener
     hears of it (unless quiet), and a row is added at the end of the app's list. window.electronAPI stands in for the session facts of
     build proofs point 6: S18's session runs and last edited a file, S19's runs the tests, S20's is linked but not
     running, S21 has none; a finished session is linked to the done S15. window.fxCalls records the open-file calls
     and the open-session and open-item events. window.fxSessionTool(sessionId, toolCall) adds a tool call and tells the listener.
     The right side holds the item view, built from the app's markup with stand-ins for the app's own styles:
     window.fxItemView(true) draws a step with two linked sessions, fxItemView(false) one with none. With
     ?frame=live an opened item stands in the item's row beside the list, as in the app, and its close button takes
     it out; window.fxOpenDocument() adds the full-page item's chat panel and the top bar's panel menu.
     dist/ must be built (node build.mjs). It loads ES modules, so it must be served over http, not opened as a
     file: the page path is extensions/job-tracker/test/fixture.html, the theme is the hash (#ink-aurora,
     #ink-bone), the window width the query (?w=1920 or ?w=2560). -->

     column (session tabs, transcript, input) sits in a grid with its own grid-area, as seen live; ?chat= picks it -->

<script type="module">
  import { colors, THEMES } from "../../ink-themes/themes.mjs";
  import { activate } from "../dist/index.js";

  const theme = THEMES.find((t) => t.id === (location.hash.slice(1) || "ink-aurora"));
  if (!theme) throw new Error(`unknown theme ${location.hash}`);
  for (const [k, v] of Object.entries(colors(theme))) document.documentElement.style.setProperty(`--nim-${k}`, v);
  document.documentElement.classList.toggle("dark-theme", theme.isDark);
  const query = new URLSearchParams(location.search);
  const w = query.get("w") || "1920";
  document.getElementById("app").classList.toggle("w2560", w === "2560");

  // ?data=jobs|no-job|empty picks the made-up project; ?name= renames the settings job (a short and a long headline);
  // ?bad=<id> gives that step a status the app does not have (the page must say so and leave the app's list in view)
  const data = query.get("data") || "items";
  const items = data === "empty" ? [] : JSON.parse(document.getElementById(data).textContent);
  const renamed = items.find((i) => i.id === "rel-1");
  if (query.get("name")) renamed.title = query.get("name");
  if (query.get("bad")) items.find((i) => i.id === query.get("bad")).status = "someday";
  const rows = document.getElementById("rows");
  const addRow = (it) => {
    const row = document.createElement("div");
    row.className = it.id === "t-19" ? "tracker-table-row bg-[var(--nim-bg-secondary)]" : "tracker-table-row";
    row.dataset.testid = "tracker-table-row";
    row.dataset.itemId = it.id;
    row.dataset.itemTitle = it.title;
    const code = (it.customFields && it.customFields.step) || "";
    const title = document.createElement("div");
    title.className = "tracker-table-cell title";
    const key = document.createElement("span");
    key.textContent = code;
    const name = document.createElement("span");
    name.textContent = it.title;
    title.append(key, " ", name);
    const meta = document.createElement("div");
    meta.className = "tracker-table-row-meta";
    for (const [col, text] of [["key", code], ["status", it.status], ["priority", "Medium"]]) {
      const cell = document.createElement("div");
      cell.dataset.columnId = col;
      cell.textContent = text;
      meta.append(cell);
    }
    const more = document.createElement("button");
    more.className = "tracker-row-more-actions";
    more.textContent = "…";
    row.append(title, meta, more);
    rows.append(row);
  };
  for (const it of items.filter((i) => i.type === "task" && !i.archived && i.status !== "done")) addRow(it);
  let heard = null;
  window.workspacePath = "/fixture-project";
  window.documentService = {
    listTrackerItems: async () => items.slice(),
    watchTrackerItems: (listener) => {
      heard = listener;
      return () => { heard = null; };
    },
  };
  // quiet: the row comes before the watch listener hears of the item (the script must read the data again itself)
  // s-4, the finished step's session, is archived: sessions:list gives it only with { includeArchived: true }, as the
  // app does (one-page proofs point 6)
  const sessions = [
    { id: "s-1", linkedTrackerItemIds: ["t-18"] },
    { id: "s-2", linkedTrackerItemIds: ["t-19"] },
    { id: "s-3", linkedTrackerItemIds: ["t-20"] },
    { id: "s-4", title: "Pick the type sizes", archived: true, linkedTrackerItemIds: ["t-15"] },
  ];
  const running = ["s-1", "s-2"];
  const tails = {
    "s-1": [
      { type: "tool_call", toolCall: { toolName: "Read", arguments: {} } },
      { type: "assistant_message" },
      { type: "tool_call", toolCall: { toolName: "Edit", arguments: {} } },
    ],
    "s-2": [{ type: "tool_call", toolCall: { toolName: "Bash", arguments: { command: "npm test", description: "Run the tests" } } }],
    "s-3": [],
  };
  let sessionHeard = null;
  // The clicks the page makes into the app: the open-file call and the open-session and open-item events
  window.fxCalls = [];
  for (const type of ["open-ai-session", "nimbalyst:navigate-tracker-item"])
    window.addEventListener(type, (e) => window.fxCalls.push({ channel: type, ...e.detail }));
  window.electronAPI = {
    invoke: async (channel, ...args) => {
      if (channel === "sessions:list")
        return { success: true, sessions: args[1] && args[1].includeArchived ? sessions : sessions.filter((x) => !x.archived) };
      if (channel === "transcript:get-tail-messages") return tails[args[0]].slice();
      if (channel === "workspace:open-file") {
        window.fxCalls.push({ channel, ...args[0] });
        return { success: true };
      }
      throw new Error(`fixture: no channel ${channel}`);
    },
    sessionState: {
      getRunningSessionIds: async () => ({ success: true, sessionIds: running }),
      subscribe: async () => ({ success: true }),
      onStateChange: (cb) => { sessionHeard = cb; },
      removeStateChangeListener: () => { sessionHeard = null; },
    },
  };
  window.fxSessionTool = (sessionId, toolCall) => {
    tails[sessionId].push({ type: "tool_call", toolCall });
    sessionHeard({ type: "session:activity", sessionId, workspacePath: "/fixture-project" });
  };
  window.fxAddStep = (it, quiet) => {
    items.push(it);
    if (!quiet) heard({ type: "added", item: it });
    addRow(it);
  };

  // The item view, from the app's markup (TrackerItemDetail, TrackerFieldPill, TrackerLinksSection,
  // TrackerCommentsSection, TypeTagsEditor of 0.83.0). linked: two linked sessions, "In Progress", waits-on and proof
  // set, text with code; not linked: "No linked sessions", "Needs you", priority High, an empty text box.
  const icon = (name, size) => `<span class="material-symbols-outlined" style="font-size: ${size}px;">${name}</span>`;
  const pill = (field, label, value, { set = true, labeled = false, color = "" } = {}) =>
    `<button type="button" class="tracker-field-pill ${set ? "tracker-field-pill-set" : "tracker-field-pill-empty"}${labeled ? " tracker-field-pill-labeled" : ""}"` +
    ` aria-expanded="false" aria-haspopup="dialog" aria-label="${label}: ${set ? value : "Not set"}" title="${set ? `${label}: ${value}` : `Set ${label}`}"` +
    ` data-testid="tracker-detail-field-pill-${field}" data-field="${field}" data-empty="${!set}">` +
    `<span class="material-symbols-outlined tracker-field-pill-icon" style="font-size: 14px;${color ? ` color: ${color};` : ""}">label</span>` +
    `${labeled ? `<span class="tracker-field-pill-label">${label}</span>` : ""}<span class="tracker-field-pill-value">${set ? value : label}</span></button>`;
  const headerButton = (title, name, extra = "") =>
    `<button class="p-1 rounded hover:bg-nim-tertiary text-nim-muted" title="${title}"${extra}>${icon(name, 18)}</button>`;
  const sessionButton = (title) =>
    `<button class="flex items-center gap-1 px-1.5 py-0.5 text-[11px] font-medium rounded text-nim-muted hover:text-nim hover:bg-nim-tertiary transition-colors" title="${title}">`;
  const linked2 = [["Look-over: quotes, wave 1", "7 mins ago"], ["Item view build: second round", "2 hours ago"]];
  const sessionEntry = ([title, ago]) =>
    `<button class="w-full flex items-center gap-2 px-2 py-1.5 rounded text-left hover:bg-nim-tertiary transition-colors group" title="Open session: ${title}">` +
    `<span class="shrink-0 flex items-center text-nim-muted"><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="currentColor"/></svg></span>` +
    `<span class="flex-1 text-xs text-nim truncate">${title}</span><span class="text-[10px] text-nim-faint shrink-0">${ago}</span></button>`;
  const linksLine = (label, type, title) =>
    `<div><div class="tracker-links-line flex items-baseline gap-2 rounded px-1.5 py-1 text-[13px] hover:bg-nim-hover cursor-pointer" role="button">` +
    `<span class="text-[9px] text-nim-faint transition-transform ">▶</span><span class="text-nim-muted shrink-0 w-28 @md:w-36 truncate">${label}</span>` +
    `<span class="text-[12px] text-nim-faint shrink-0 w-4">1</span><span class="flex min-w-0 flex-wrap items-baseline gap-x-3 gap-y-0.5">` +
    `<button class="tracker-links-page inline-flex items-baseline gap-1 min-w-0 text-nim hover:underline"><span class="text-[11px] text-nim-faint">${type}</span>` +
    `<span class="truncate">${title}</span></button></span></div></div>`;
  // A long list as a release's "Includes" (live 2026-11-14): more than six targets, some finished (they fold), one
  // title far wider than the panel (it must end in "…", not run under the scrollbar)
  const linksMany = (label, titles) =>
    `<div><div class="tracker-links-line flex items-baseline gap-2 rounded px-1.5 py-1 text-[13px] hover:bg-nim-hover cursor-pointer" role="button">` +
    `<span class="text-[9px] text-nim-faint transition-transform ">▶</span><span class="text-nim-muted shrink-0 w-28 @md:w-36 truncate">${label}</span>` +
    `<span class="text-[12px] text-nim-faint shrink-0 w-4">${titles.length}</span><span class="flex min-w-0 flex-wrap items-baseline gap-x-3 gap-y-0.5">` +
    titles.map((t) => `<button class="tracker-links-page inline-flex items-baseline gap-1 min-w-0 text-nim hover:underline"><span class="text-[11px] text-nim-faint">Task</span>` +
      `<span class="truncate">${t}</span></button>`).join("") +
    `</span></div></div>`;
  const includes = ["Build the new settings layout", "Look over the whole settings window again, live, after the restart, in both themes, at both widths and with every menu open",
    "Write the tests for the new screen", "Fix the toggle that forgets its state", "Fix the search box losing focus", "Fix the slow first load",
    "Fix the wrong date format", "Your look at the built screen"];
  const label11 = (text) => `<label class="text-[11px] font-medium text-nim-muted uppercase tracking-[0.5px]">${text}</label>`;
  const h4 = (text) => `<h4 class="text-xs font-medium text-nim-muted uppercase tracking-wide">${text}</h4>`;
  window.fxItemView = (linked) => {
    const status = linked ? pill("status", "Status", "In Progress", { color: "#eab308" }) : pill("status", "Status", "Needs you", { color: "#f59e0b" });
    document.getElementById("detail").innerHTML =
      `<div class="tracker-item-detail flex flex-col h-full bg-nim overflow-hidden" data-testid="tracker-item-detail">` +
      `<div class="tracker-item-detail-header flex items-start gap-2 px-4 pt-4 pb-3 border-b border-nim shrink-0">` +
      `<span class="mt-1 shrink-0" style="color: #2563eb;">${icon("task_alt", 20)}</span>` +
      `<div class="flex-1 min-w-0"><textarea rows="1" class="w-full bg-transparent border-none outline-none text-base font-semibold text-nim placeholder:text-nim-faint p-0 m-0 resize-none overflow-hidden leading-snug break-words" placeholder="Item title..." data-testid="tracker-detail-title">${linked ? "Restyle the item view so it reads at a glance" : "Write the release notes for 3.1"}</textarea>` +
      `<div class="flex items-center gap-2 mt-1 flex-wrap">` +
      `<span class="text-[10px] font-medium px-1.5 py-0.5 rounded" style="color: #2563eb; background-color: #2563eb20;">Task</span>` +
      `<span class="text-[10px] font-medium px-1.5 py-0.5 rounded flex items-center gap-0.5 bg-gray-500/[0.125] text-gray-400" title="Stored in database — not backed by a file" data-testid="tracker-source-db-badge">${icon("storage", 11)}Database</span>` +
      `<span class="tracker-item-local-key text-[10px] text-nim-faint font-mono" title="A local key until the item is published" data-testid="tracker-item-local-key">${linked ? "CLS.74" : "CLS.75"}</span>` +
      `<span class="tracker-publication-chip inline-flex items-center gap-1 px-[7px] py-[2px] rounded-[10px] text-[10px] font-semibold" data-publication="published" data-testid="tracker-publication-chip" title="Your team can see this item">${icon("group", 11)}Published</span>` +
      `</div></div><div class="flex items-center gap-1 shrink-0">` +
      headerButton("Archive", "archive") +
      `<button class="p-1 rounded hover:bg-nim-tertiary text-nim-muted hover:text-[#ef4444]" title="Delete permanently">${icon("delete", 18)}</button>` +
      headerButton("Focus content", "fullscreen", ' data-testid="tracker-content-focus-toggle"') +
      headerButton("Close (Esc)", "close") +
      `</div></div>` +
      `<div class="flex-1 overflow-y-auto px-4 py-3 space-y-4">` +
      `<div class="tracker-sessions-section"><div class="flex items-center justify-between mb-1.5">${label11(linked ? "Sessions (2)" : "Sessions")}<div class="flex items-center gap-1">` +
      `${sessionButton("Link an existing AI session to this item")}${icon("link", 14)}Link Existing</button>` +
      `${sessionButton("Launch a new AI session for this item")}${icon("add", 14)}Launch Session</button>` +
      `${sessionButton("Launch a new isolated worktree session for this item")}${icon("account_tree", 14)}Launch Worktree</button></div></div>` +
      (linked ? `<div class="space-y-1">${linked2.map(sessionEntry).join("")}</div>` : `<p class="text-[11px] text-nim-faint m-0">No linked sessions</p>`) +
      `</div>` +
      `<div class="tracker-detail-fields pt-1 border-t border-nim"><div class="tracker-field-pills tracker-detail-field-pills" data-testid="tracker-detail-field-pills">` +
      status +
      pill("priority", "Priority", linked ? "Medium" : "High") +
      pill("owner", "Owner", "", { set: false }) +
      pill("step", "Step", linked ? "pipe D2" : "T9") +
      pill("stage", "Stage", linked ? "Part 5 · docs" : "Part 3 · builds") +
      pill("budget", "Budget", linked ? "20" : "8") +
      pill("dependsOn", "Depends On", "Collect the facts", { labeled: true }) +
      pill("blocks", "Blocks", "", { set: false }) +
      pill("collection", "Collection", "3.1 · Settings refresh", { labeled: true }) +
      pill("goal", "Goal", "", { set: false }) +
      (linked ? pill("waitsOn", "Waits On", "your OK") + pill("proof", "Proof", "pictures in both themes") : pill("waitsOn", "Waits On", "", { set: false }) + pill("proof", "Proof", "", { set: false })) +
      `</div></div>` +
      `<div class="tracker-detail-tags" data-testid="tracker-detail-tags"><div class="space-y-1"><div class="flex items-center">${label11("Tags")}</div>` +
      `<div class="flex flex-wrap gap-1 items-center"><input class="flex-1 bg-transparent text-[12px] outline-none" placeholder="Add tag..."></div></div></div>` +
      `<div class="tracker-type-tags-editor space-y-1"><div class="flex items-center gap-2"><span class="text-[10px] text-nim-faint font-medium uppercase tracking-wider">Type Tags</span>` +
      `<button class="text-[10px] text-nim-muted hover:text-nim px-1 py-0.5 rounded hover:bg-nim-tertiary">+ Add</button></div></div>` +
      `<div class="pt-1 border-t border-nim"><label class="text-[11px] font-medium text-nim-muted uppercase tracking-[0.5px] block mb-1">Content</label>` +
      `<div class="tracker-content-editor relative bg-nim overflow-hidden min-h-[200px] border border-nim rounded" data-testid="tracker-detail-content-editor">` +
      `<div class="ContentEditable__root" contenteditable="true" role="textbox">` +
      (linked
        ? `<p class="nim-paragraph" dir="ltr"><strong class="nim-text-bold" data-lexical-text="true">Serves:</strong><span data-lexical-text="true"> "a user will be overwhelmed" by the item view as it is.</span></p>` +
          `<p class="nim-paragraph" dir="ltr"><strong class="nim-text-bold" data-lexical-text="true">Done when:</strong><span data-lexical-text="true"> the view shows one status line and one filled button, and </span><span class="nim-text-code" data-lexical-text="true">node test.mjs --pictures</span><span data-lexical-text="true"> passes.</span></p>`
        : `<p class="nim-paragraph"><br></p>`) +
      `</div><div class="draggable-block-menu"><span>+</span><span>⋮⋮</span></div></div></div>` +
      `<div class="tracker-links-section @container space-y-1 select-text">${h4("Links")}${linksLine("In collection", "Release", "3.1 · Settings refresh")}${linksLine("Depends on", "Task", "Collect the facts about the settings data")}${linked ? linksMany("Includes", includes) : ""}</div>` +
      `<div class="space-y-2"><div class="flex items-center justify-between">${h4("Comments")}</div><div class="tracker-comments-section space-y-2 select-text">` +
      `<div class="tracker-comment-composer flex gap-1"><input type="text" aria-label="Comment" placeholder="Add a comment..." class="min-w-0 flex-1 bg-nim-secondary border border-nim rounded px-2 py-1 text-xs text-nim placeholder:text-nim-faint outline-none focus:border-nim-primary" data-testid="tracker-comment-input">` +
      `<button disabled class="px-2 py-1 rounded text-xs bg-nim-primary text-nim-on-primary disabled:opacity-40 hover:opacity-90 transition-opacity">Post</button></div></div></div>` +
      `<div class="space-y-2">${h4("Activity")}<div class="space-y-1">` +
      [["Claude", "set Status to In Progress", "7 mins ago"], ["You", "linked a session", "20 mins ago"], ["Claude", "created this item", "50 mins ago"]]
        .map(([who, what, ago]) => `<div class="flex items-start gap-2 text-[11px]"><span class="text-nim-muted shrink-0">${who}</span><span class="text-nim-faint">${what}</span><span class="text-nim-faint ml-auto shrink-0">${ago}</span></div>`)
        .join("") +
      `</div></div>` +
      `<div class="pt-1 border-t border-nim"><div class="grid grid-cols-2 gap-2 text-[11px]">` +
      `<div class="col-span-2 flex items-center gap-1.5"><span class="text-nim-faint shrink-0">Created by</span><span class="text-nim-muted">Claude</span><span class="text-[10px] text-nim-faint bg-nim-tertiary px-1 py-0.5 rounded">via AI</span></div>` +
      `<div><span class="text-nim-faint">Created</span><div class="text-nim-muted">13 Nov 2026, 17:02</div></div>` +
      `<div><span class="text-nim-faint">Updated</span><div class="text-nim-muted">14 Nov 2026, 09:40</div></div>` +
      `<div><span class="text-nim-faint">Sync</span><div class="text-nim-muted"><span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-medium" style="background-color: #f59e0b20; color: #b45309;">pending</span></div></div>` +
      `<div class="col-span-2"><span class="text-nim-faint">Source</span><div class="text-nim-muted truncate">Database (no file backing)</div></div>` +
      `</div></div></div></div>`;
    // The app sizes the title's box to its text
    const title = document.querySelector('[data-testid="tracker-detail-title"]');
    title.style.height = `${title.scrollHeight}px`;
  };
  window.fxItemView(true);
  if (query.get("sessions") === "none") document.querySelector(".agent-mode").remove();
  // ?chat=on shows the chat column on the page; none: no session open, so the app draws no column; missing: a
  // session is open but its column is not where the page looks (a renamed app). With no ?chat the stored choice
  // keeps the chat hidden, so the other states keep their measures. The kept chat width is forgotten too, unless
  // ?keep is given (a reload that checks what was kept).
  const chat = query.get("chat");
  if (!query.has("keep")) {
    if (chat === null) localStorage.setItem("job-tracker.chatShown", "false");
    else localStorage.removeItem("job-tracker.chatShown");
    localStorage.removeItem("job-tracker.chatWidth");
  }
  document.getElementById("app").classList.toggle("fx-live", query.get("frame") === "live");
  // ?wrap=app: the tracker row as the live app builds it (TrackerMode): its one child is the app's resizable panel,
  // the left column (sidebar, later the Sessions column) on its left and the page on its right
  if (query.get("wrap") === "app") {
    const panel = document.createElement("div");
    panel.className = "fx-panel";
    const right = document.createElement("div");
    right.className = "fx-panel-right";
    right.append(document.getElementById("fx-view"));
    panel.append(document.querySelector(".fx-app > .fx-left"), right);
    document.querySelector(".tracker-mode").append(panel);
    document.getElementById("app").classList.add("fx-wrap");
  }
  const area = document.getElementById("fx-chat");
  if (area && (chat === "none" || chat === "missing")) area.remove();
  if (chat === "none")
    for (const row of document.querySelectorAll('[data-testid="session-list-item"]')) row.removeAttribute("aria-current");
  // A click on a Sessions row, as the app does it: the row becomes the open one and the chat column shows its
  // session; with no session open before, the app draws the column in its home
  for (const row of document.querySelectorAll('[data-testid="session-list-item"]'))
    row.addEventListener("click", () => {
      for (const r of document.querySelectorAll('[data-testid="session-list-item"]')) r.removeAttribute("aria-current");
      row.setAttribute("aria-current", "page");
      if (chat === "missing") return;
      const home = document.getElementById("fx-chat-home");
      if (!document.getElementById("fx-chat")) home.insertBefore(area, document.getElementById("fx-chat-next"));
      document.getElementById("fx-chat-title").textContent = row.textContent;
    });
  // Leaving the tracker, as the app does it: its page gets the class "hidden"
  window.fxLeave = () => document.querySelector('[data-layout="tracker-mode-wrapper"]').classList.add("hidden");
  // ?frame=live: opening an item, as the app does it, puts its region in the item's row beside the list, 400 px wide
  // (the app's default detailPanelWidth); its "Close (Esc)" button takes the region out again
  if (query.get("frame") === "live") {
    const detail = document.getElementById("detail");
    window.addEventListener("nimbalyst:navigate-tracker-item", () => {
      detail.style.width = "400px";
      document.getElementById("fx-view").append(detail);
    });
    detail.addEventListener("click", (e) => {
      if (e.target.closest('button[title="Close (Esc)"]')) detail.remove();
    });
  }
  // A full-page item, as the app draws its parts: the right panel holding "Chat about this item" with its drag line
  // before it, and the top bar's panel menu (opened) with that option and "Discussion"
  window.fxOpenDocument = () => {
    const view = document.getElementById("fx-view");
    const drag = document.createElement("div");
    drag.dataset.testid = "tracker-document-right-panel-resize";
    drag.setAttribute("role", "separator");
    const panel = document.createElement("div");
    panel.dataset.testid = "tracker-document-right-panel";
    panel.innerHTML = `<div class="tracker-document-panel" data-testid="tracker-document-panel" data-mode="chat">Chat about this item</div>`;
    view.append(drag, panel);
    const menu = document.createElement("div");
    menu.dataset.testid = "window-top-bar-right-pane-menu";
    menu.innerHTML = [["forum", "Chat about this item"], ["chat", "Discussion"]]
      .map(([i, l]) => `<button type="button" role="menuitem">${icon(i, 17)}<span>${l}</span></button>`)
      .join("");
    document.body.append(menu);
  };
  activate();
</script>
</body>
</html>
